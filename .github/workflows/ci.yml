name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Regenerate definitions
        run: go generate ./...

      - name: Verify generated files
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Test Windows 386
        env:
          GOARCH: '386'
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build metadata exporter
        run: dotnet build tools/winmd-exporter/winmd-exporter.csproj --configuration Release --no-restore

      - name: Verify native Windows structure layouts
        shell: pwsh
        run: ./tools/verify-abi.ps1

      - name: Compile Windows ARM64 tests
        env:
          GOARCH: arm64
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'win32defs-arm64'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          go test -c -o "$outputDir/" ./...

      - name: Verify offline regeneration
        run: go run ./cmd/win32defs-gen -offline

      - name: Verify offline output
        run: git diff --exit-code
